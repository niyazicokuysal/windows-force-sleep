ShortDescription: Windows bilgisayarını gerçekten uyutur ve neden uyumadığını açıklar.
Description: |-
  Windows bazen gerçekten uyumaz: ekranlar kararır ama bilgisayar çalışmaya devam eder ve fareye dokununca hemen açılır.
  Force Sleep, bilgisayarı uyutan, gerçekten uyuyup uyumadığını kontrol eden ve uyumadıysa zorla uykuya ya da hazırda bekletmeye geçen küçük bir tepsi uygulamasıdır.
  "Neden uyumadı?" penceresi sebebi sade bir dille açıklar (uzakta modu, uyandırma zamanlayıcıları, bilgisayarı uyandırabilen aygıtlar, uyanık tutan programlar) ve tek tıkla, geri alınabilir şekilde düzeltir.
