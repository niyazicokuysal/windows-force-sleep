ShortDescription: Puts your Windows PC to sleep for real, and explains why it didn't.
Description: |-
  Sometimes Windows doesn't really sleep: the screens go dark but the PC keeps running and wakes the moment you touch the mouse.
  Force Sleep is a small tray app that puts the PC to sleep, checks that it actually slept, and falls back to forced sleep or hibernate if it didn't.
  Its "Why didn't it sleep?" window explains the cause in plain words (away mode, wake timers, devices allowed to wake the PC, programs keeping it awake) and fixes it in one click, with undo.
